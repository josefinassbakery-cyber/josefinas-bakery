<!doctype html>
<html lang="es">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Josefina's Bakery</title>

<style>
:root{
  --b:#5b3826;
  --c:#f7f0e7;
  --p:#fffdf9;
  --l:#dfd2c6;
  --s:#eee2d5
}

body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:var(--c);
  color:#3b2a20
}

header{
  background:var(--b);
  color:white;
  padding:22px 18px;
  border-radius:0 0 24px 24px
}

main{
  max-width:850px;
  margin:auto;
  padding:16px
}

.card,
section{
  background:var(--p);
  padding:15px;
  border-radius:18px;
  margin:12px 0
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

input,
select,
textarea{
  width:100%;
  padding:11px;
  border:1px solid var(--l);
  border-radius:10px;
  box-sizing:border-box;
  margin:5px 0 10px
}

button{
  padding:11px 14px;
  border:0;
  border-radius:12px;
  font-weight:700;
  cursor:pointer
}

.primary{
  background:var(--b);
  color:white
}

.secondary{
  background:white;
  border:1px solid var(--l);
  color:var(--b)
}

.item{
  padding:8px 0;
  border-bottom:1px solid #eee
}

.tag{
  display:inline-block;
  background:var(--s);
  padding:5px 8px;
  border-radius:8px;
  font-size:12px;
  margin:4px 3px 0 0
}
</style>

</head>

<body>

<header>
  <h1>Josefina's Bakery 🥖</h1>
  <div>Panes, café y más · Horneamos con amor</div>
</header>

<main>

<section>

<h2>Nuevo pedido</h2>

<input id="client" placeholder="Cliente">

<input id="date" type="date">

<div id="items"></div>

<button class="secondary" onclick="addItem()">
➕ Agregar producto
</button>

<h3>
Total: <span id="total">$0.00</span>
</h3>

<div id="payments"></div>

<button class="secondary" onclick="addPayment()">
➕ Agregar pago
</button>

<div>
Pagado: <b id="paid">$0.00</b>
·
Saldo: <b id="balance">$0.00</b>
</div>

<br>

<select id="status">

<option>Pendiente de elaborar</option>
<option>Pre-elaborado</option>
<option>Listo para entregar</option>
<option>Entregado</option>
<option>Finalizado</option>

</select>

<textarea
id="notes"
placeholder="Notas / pedido especial">
</textarea>

<button class="primary" onclick="save()">
Guardar pedido
</button>

</section>


<section>

<h2>Pedidos</h2>

<div id="orders"></div>

</section>

</main>


<script>

const products = {{products|tojson}};

let cart = [
  {
    product: '',
    qty: 1,
    unit_price: 0
  }
];

let pays = [];


/* =========================
   DINERO
   ========================= */

function money(n){

  return '$' + Number(n || 0).toFixed(2);

}


/* =========================
   AGREGAR PRODUCTO
   ========================= */

function addItem(){

  cart.push({
    product: '',
    qty: 1,
    unit_price: 0
  });

  render();

}


/* =========================
   CAMBIAR PRODUCTO
   ========================= */

function changeProduct(index, value){

  const selectedProduct = products.find(
    p => p[0] === value
  );

  if(selectedProduct){

    cart[index].product = selectedProduct[0];

    cart[index].unit_price = Number(
      selectedProduct[1]
    ) || 0;

  }else{

    cart[index].product = '';

    cart[index].unit_price = 0;

  }

  render();

}


/* =========================
   AGREGAR PAGO
   ========================= */

function addPayment(){

  pays.push({
    method: 'Efectivo',
    amount: 0
  });

  render();

}


/* =========================
   MOSTRAR PEDIDO
   ========================= */

function render(){

  document.getElementById('items').innerHTML = cart.map((x,i) => {

    let productOptions = `
      <option value="">
        Seleccione un producto
      </option>
    `;

    products.forEach(p => {

      const selected =
        p[0] === x.product
          ? 'selected'
          : '';

      productOptions += `
        <option
          value="${p[0]}"
          ${selected}
        >
          ${p[0]} — ${money(p[1])}
        </option>
      `;

    });


    return `

      <div class="item">

        <select
          onchange="changeProduct(${i}, this.value)"
        >

          ${productOptions}

        </select>


        <input
          type="number"
          min="1"
          value="${x.qty}"

          onchange="
            cart[${i}].qty =
              Math.max(
                1,
                Number(this.value) || 1
              );

            render();
          "
        >

      </div>

    `;

  }).join('');


  /* =========================
     PAGOS
     ========================= */

  document.getElementById('payments').innerHTML =
    pays.map((p,i) => `

      <div class="row">

        <select
          onchange="
            pays[${i}].method = this.value
          "
        >

          <option
            value="Efectivo"
            ${p.method === 'Efectivo'
              ? 'selected'
              : ''}
          >
            Efectivo
          </option>

          <option
            value="Zelle"
            ${p.method === 'Zelle'
              ? 'selected'
              : ''}
          >
            Zelle
          </option>

          <option
            value="Cash App"
            ${p.method === 'Cash App'
              ? 'selected'
              : ''}
          >
            Cash App
          </option>

          <option
            value="Tarjeta"
            ${p.method === 'Tarjeta'
              ? 'selected'
              : ''}
          >
            Tarjeta
          </option>

          <option
            value="Otro"
            ${p.method === 'Otro'
              ? 'selected'
              : ''}
          >
            Otro
          </option>

        </select>


        <input
          type="number"
          step=".01"
          min="0"
          placeholder="Monto"
          value="${p.amount}"

          onchange="
            pays[${i}].amount =
              Math.max(
                0,
                Number(this.value) || 0
              );

            render();
          "
        >

      </div>

    `).join('');


  /* =========================
     TOTALES
     ========================= */

  const totalAmount = cart.reduce(

    (sum,item) => {

      return sum +
        (
          Number(item.qty) *
          Number(item.unit_price)
        );

    },

    0

  );


  const paidAmount = pays.reduce(

    (sum,payment) => {

      return sum +
        Number(payment.amount || 0);

    },

    0

  );


  document.getElementById('total').textContent =
    money(totalAmount);

  document.getElementById('paid').textContent =
    money(paidAmount);

  document.getElementById('balance').textContent =
    money(
      Math.max(
        0,
        totalAmount - paidAmount
      )
    );

}


/* =========================
   GUARDAR PEDIDO
   ========================= */

async function save(){

  if(
    !document.getElementById('client').value ||
    !document.getElementById('date').value
  ){

    return alert(
      'Agrega cliente y fecha.'
    );

  }


  if(!cart.length){

    return alert(
      'Agrega al menos un producto.'
    );

  }


  const invalidProduct = cart.some(
    item => !item.product
  );


  if(invalidProduct){

    return alert(
      'Selecciona un producto en cada línea antes de guardar el pedido.'
    );

  }


  const r = await fetch(

    '/orders',

    {
      method:'POST',

      headers:{
        'Content-Type':'application/json'
      },

      body:JSON.stringify({

        client:
          document.getElementById('client').value,

        delivery_date:
          document.getElementById('date').value,

        status:
          document.getElementById('status').value,

        notes:
          document.getElementById('notes').value,

        items:cart,

        payments:pays

      })

    }

  );


  if(r.ok){

    location.reload();

  }else{

    alert(
      'No se pudo guardar.'
    );

  }

}


/* =========================
   ELIMINAR PEDIDO
   ========================= */

async function remove(id){

  if(
    confirm(
      '¿Eliminar este pedido?'
    )
  ){

    await fetch(

      '/orders/' + id,

      {
        method:'DELETE'
      }

    );

    location.reload();

  }

}


/* =========================
   INICIO
   ========================= */

render();


/* =========================
   MOSTRAR PEDIDOS
   ========================= */

document.getElementById('orders').innerHTML = `

{% for o in orders %}

<div class="card">

<b>{{o.client}}</b>

—

{{'$%.2f'|format(o.total)}}

<br>


{% for i in o.items %}

{{i.qty}}

×

{{i.product}}

—

{{'$%.2f'|format(i.qty*i.unit_price)}}

<br>

{% endfor %}


<span class="tag">

📅 {{o.delivery_date}}

</span>


<span class="tag">

📌 {{o.status}}

</span>


<span class="tag">

💰 Pagado {{'$%.2f'|format(o.paid)}}

·

Saldo {{'$%.2f'|format(o.balance)}}

</span>


{% if o.notes %}

<br>

📝 {{o.notes}}

{% endif %}


<br>


<button
class="secondary"
onclick="remove({{o.id}})"
>

Eliminar

</button>

</div>

{% endfor %}

`;

</script>

</body>
</html>
