<!doctype html>

<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Josefina's Bakery · Gestión</title>
<style>
:root{
  --b:#5b3826;
  --c:#f7f0e7;
  --p:#fffdf9;
  --l:#dfd2c6;
  --s:#eee2d5;
  --soft:#f3e8dc;
  --ok:#e6f1e8;
  --ok-text:#28623b;
  --warn:#fff0cf;
  --warn-text:#7a5200;
  --danger:#f8dddd;
  --danger-text:#8b2020;
  --shadow:0 8px 24px rgba(91,56,38,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--c);
  color:#3b2a20;
}
header{
  background:linear-gradient(135deg,#5b3826,#7b5038);
  color:white;
  padding:28px 18px 22px;
  border-radius:0 0 28px 28px;
  box-shadow:var(--shadow);
}
.header-inner{max-width:1000px;margin:auto}
.brand{font-family:Georgia,serif;font-size:30px;font-weight:700}
.tagline{margin-top:5px;opacity:.92}
nav{
  max-width:1000px;
  margin:14px auto 0;
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:0 2px 3px;
}
.nav-btn{
  background:rgba(255,255,255,.14);
  color:white;
  border:1px solid rgba(255,255,255,.24);
  white-space:nowrap;
  padding:10px 13px;
  border-radius:12px;
}
.nav-btn.active{background:white;color:var(--b)}
main{max-width:1000px;margin:auto;padding:18px}
.view{display:none}
.view.active{display:block}
.hero{
  background:var(--p);
  border:1px solid var(--l);
  border-radius:24px;
  padding:22px;
  box-shadow:var(--shadow);
}
.hero h1{font-family:Georgia,serif;margin:0 0 7px;color:var(--b)}
.hero p{margin:0;color:#6c5648}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin:14px 0;
}
.metric{
  background:var(--p);
  border:1px solid var(--l);
  border-radius:18px;
  padding:16px;
  box-shadow:var(--shadow);
}
.metric .icon{font-size:23px}
.metric .label{font-size:13px;color:#735f51;margin-top:6px}
.metric .value{font-size:22px;font-weight:800;color:var(--b);margin-top:3px}
.alert{
  background:var(--danger);
  color:var(--danger-text);
  border:1px solid #e7bcbc;
  border-radius:16px;
  padding:14px 16px;
  margin:12px 0;
  font-weight:700;
}
.quick{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:16px;
}
.quick button{min-height:64px}
.card,section{
  background:var(--p);
  padding:17px;
  border-radius:18px;
  margin:12px 0;
  border:1px solid var(--l);
  box-shadow:var(--shadow);
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select,textarea{
  width:100%;
  padding:11px;
  border:1px solid var(--l);
  border-radius:10px;
  margin:5px 0 10px;
  background:white;
}
textarea{min-height:90px;resize:vertical}
button{
  padding:11px 14px;
  border:0;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
}
.primary{background:var(--b);color:white}
.secondary{background:white;border:1px solid var(--l);color:var(--b)}
.danger{background:var(--danger);color:var(--danger-text);border:1px solid #e7bcbc}
.item{padding:12px 0;border-bottom:1px solid #eee}
.item:last-child{border-bottom:0}
.item-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.subtotal{font-weight:700;margin:4px 0 8px}
