<!doctype html>
<html lang="es">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Josefina's Bakery</title>


<style>

:root{

  --b:#5b3826;
  --c:#f7f0e7;
  --p:#fffdf9;
  --l:#dfd2c6;
  --s:#eee2d5;

}


body{

  margin:0;

  font-family:system-ui,sans-serif;

  background:var(--c);

  color:#3b2a20;

}


header{

  background:var(--b);

  color:white;

  padding:22px 18px;

  border-radius:0 0 24px 24px;

}


main{

  max-width:850px;

  margin:auto;

  padding:16px;

}


.card,
section{

  background:var(--p);

  padding:15px;

  border-radius:18px;

  margin:12px 0;

}


.row{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;

}


input,
select,
textarea{

  width:100%;

  padding:11px;

  border:1px solid var(--l);

  border-radius:10px;

  box-sizing:border-box;

  margin:5px 0 10px;

}


button{

  padding:11px 14px;

  border:0;

  border-radius:12px;

  font-weight:700;

  cursor:pointer;

}


.primary{

  background:var(--b);

  color:white;

}


.secondary{

  background:white;

  border:1px solid var(--l);

  color:var(--b);

}


.danger{

  background:#f8dddd;

  color:#8b2020;

  border:1px solid #e7bcbc;

}


.item{

  padding:12px 0;

  border-bottom:1px solid #eee;

}


.item-actions{

  display:flex;

  align-items:center;

  gap:8px;

  flex-wrap:wrap;

}


.subtotal{

  font-weight:700;

  margin:4px 0 8px;

}


.products-summary{

  background:var(--s);

  padding:12px;

  border-radius:12px;

  margin:12px 0;

}


.products-summary-title{

  font-weight:800;

  margin-bottom:6px;

}


.promotion-info{

  background:#f7efe5;

  border:1px solid var(--l);

  padding:8px 10px;

  border-radius:10px;

  font-size:13px;

  margin:2px 0 8px;

}


.payment{

  padding:10px 0;

  border-bottom:1px solid #eee;

}


.payment-actions{

  display:flex;

  align-items:center;

  gap:8px;

}


.tag{

  display:inline-block;

  background:var(--s);

  padding:5px 8px;

  border-radius:8px;

  font-size:12px;

  margin:4px 3px 0 0;

}


.payment-status{

  display:inline-block;

  padding:6px 10px;

  border-radius:9px;

  background:var(--s);

  font-weight:700;

  font-size:13px;

  margin-top:8px;

}


.order-buttons{

  display:flex;

  gap:8px;

  flex-wrap:wrap;

  margin-top:12px;

}


@media(max-width:600px){

  .row{

    grid-template-columns:1fr;

  }

}

</style>

</head>


<body>


<header>

  <h1>Josefina's Bakery 🥖</h1>

  <div>
    Panes, café y más · Horneamos con amor
  </div>

</header>


<main>


<section>

<h2 id="formTitle">
  Nuevo pedido
</h2>


<input
  id="client"
  placeholder="Cliente"
>


<input
  id="date"
  type="date"
>


<div id="items"></div>


<button
  class="secondary"
  onclick="addItem()"
>

  ➕ Agregar producto

</button>


<div class="products-summary">

  <div class="products-summary-title">
    Resumen de productos
  </div>

  <div id="productSummary">
    Sin productos
  </div>

  <div style="margin-top:10px">

    <b>
      Subtotal productos:
    </b>

    <span id="productsSubtotal">$0.00</span>

  </div>

</div>


<h3>

  Total:
  <span id="total">$0.00</span>

</h3>


<h3>
  Pagos
</h3>


<div id="payments"></div>


<button
  class="secondary"
  onclick="addPayment()"
>

  ➕ Agregar pago

</button>


<div>

  Pagado:
  <b id="paid">$0.00</b>

  ·

  Saldo:
  <b id="balance">$0.00</b>

</div>


<div>

  Estado del pago:
  <b id="paymentStatus">
    No pagado
  </b>

</div>


<br>


<label>
  Estado del pedido
</label>


<select
  id="status"
  onchange="statusChanged()"
>

  <option>
    Pendiente de elaborar
  </option>

  <option>
    Pre-elaborado
  </option>

  <option>
    Listo para entregar
  </option>

  <option>
    Entregado
  </option>

  <option>
    Cancelado
  </option>

</select>


<textarea
  id="notes"
  placeholder="Notas / pedido especial"
></textarea>


<button
  id="saveButton"
  class="primary"
  onclick="save()"
>

  Guardar pedido

</button>


<button
  id="cancelEditButton"
  class="secondary"
  onclick="cancelEdit()"
  style="display:none;margin-left:6px"
>

  Cancelar edición

</button>


</section>



<section>

<h2>
  Pedidos
</h2>


<div id="orders"></div>


</section>


</main>



<script>


/* =========================
   PRODUCTOS
   ========================= */

const products = {{products|tojson}};


/* =========================
   VARIABLES
   ========================= */

let cart = [];

let pays = [];

let editingOrderId = null;


/* =========================
   DINERO
   ========================= */

function money(n){

  return '$' +
    Number(n || 0).toFixed(2);

}


/* =========================
   PRODUCTO VACÍO
   ========================= */

function emptyProduct(){

  return {

    product:'',
    qty:1,
    unit_price:0

  };

}


/* =========================
   PROMOCIONES
   ========================= */

window.promotions =
  {{promotions|default([], true)|tojson}};


function changePromotion(index, promotionId){

  if(!promotionId){

    cart[index].promotion_id = '';

    cart[index].promotion_name = '';

    cart[index].promotion_description = '';

    render();

    return;

  }


  const promo =
    (window.promotions || []).find(
      p => p.id === promotionId
    );


  if(!promo){

    return;

  }


  cart[index].product =
    promo.name;

  cart[index].qty =
    1;

  cart[index].unit_price =
    Number(promo.price) || 0;

  cart[index].promotion_id =
    promo.id;

  cart[index].promotion_name =
    promo.name;

  cart[index].promotion_description =
    promo.includes ||
    promo.description ||
    '';


  render();

}


/* =========================
   AGREGAR PRODUCTO
   ========================= */

function addItem(){

  cart.push(
    emptyProduct()
  );

  render();

}


/* =========================
   ELIMINAR PRODUCTO
   ========================= */

function deleteItem(index){

  cart.splice(index,1);

  /*
     Si eliminamos todos los productos
     dejamos una línea vacía para poder
     continuar agregando.
  */

  if(cart.length === 0){

    cart.push(
      emptyProduct()
    );

  }

  render();

}


/* =========================
   CAMBIAR PRODUCTO
   ========================= */

function changeProduct(index,value){

  const selectedProduct =
    products.find(
      p => p[0] === value
    );


  if(selectedProduct){

    cart[index].product =
      selectedProduct[0];

    cart[index].unit_price =
      Number(selectedProduct[1]) || 0;

    cart[index].promotion_id = '';

    cart[index].promotion_name = '';

    cart[index].promotion_description = '';

  }else{

    cart[index].product = '';

    cart[index].unit_price = 0;

  }


  render();

}


/* =========================
   CAMBIAR CANTIDAD
   ========================= */

function changeQty(index,value){

  cart[index].qty =
    Math.max(
      1,
      Number(value) || 1
    );

  render();

}


/* =========================
   AGREGAR PAGO
   ========================= */

function addPayment(){

  pays.push({

    method:'Efectivo',

    amount:0

  });

  render();

}


/* =========================
   ELIMINAR PAGO
   ========================= */

function deletePayment(index){

  pays.splice(index,1);

  render();

}


/* =========================
   CAMBIAR ESTADO
   ========================= */

function statusChanged(){

  const status =
    document.getElementById('status').value;


  if(status === 'Cancelado'){

    const confirmed = confirm(
      'Al cancelar este pedido, los productos y pagos quedarán en $0.00. ¿Deseas continuar?'
    );


    if(confirmed){

      cart = [];

      pays = [];

      render();

    }else{

      document.getElementById('status').value =
        'Pendiente de elaborar';

    }

  }

}


/* =========================
   MOSTRAR PEDIDO
   ========================= */

function render(){

  const itemsContainer =
    document.getElementById('items');


  itemsContainer.innerHTML =
    cart.map((x,i) => {

      let productOptions = `

        <option value=""
          ${x.product === ''
            ? 'selected'
            : ''}
        >

          Seleccione un producto

        </option>

      `;


      products.forEach(p => {

        const selected =
          p[0] === x.product
            ? 'selected'
            : '';


        productOptions += `

          <option
            value="${p[0]}"
            ${selected}
          >

            ${p[0]} — ${money(p[1])}

          </option>

        `;

      });


      /* =========================
         PROMOCIONES
         ========================= */

      let promotionOptions = `

        <option value=""
          ${x.promotion_id
            ? ''
            : 'selected'}
        >

          Seleccione una promoción

        </option>

      `;


      (window.promotions || []).forEach(promo => {

        const selected =
          x.promotion_id === promo.id
            ? 'selected'
            : '';


        promotionOptions += `

          <option
            value="${promo.id}"
            ${selected}
          >

            ${promo.name} — ${money(promo.price)}

          </option>

        `;

      });


      const subtotal =
        Number(x.qty || 0) *
        Number(x.unit_price || 0);


      const promotionInfo =
        x.promotion_id &&
        x.promotion_description
          ? `
            <div class="promotion-info">

              🎁
              ${x.promotion_description}

            </div>
          `
          : '';


      return `

        <div class="item">

          <label>
            Producto
          </label>

          <select
            onchange="
              changeProduct(
                ${i},
                this.value
              )
            "
          >

            ${productOptions}

          </select>


          <label>
            Promoción
          </label>

          <select
            onchange="
              changePromotion(
                ${i},
                this.value
              )
            "
          >

            ${promotionOptions}

          </select>


          ${promotionInfo}


          <div class="item-actions">

            <label>
              Cantidad:
            </label>

            <input
              type="number"
              min="1"
              value="${x.qty}"
              style="max-width:120px"
              onchange="
                changeQty(
                  ${i},
                  this.value
                )
              "
            >


            <button
              class="danger"
              type="button"
              onclick="
                deleteItem(${i})
              "
            >

              🗑️ Eliminar producto

            </button>

          </div>


          <div class="subtotal">

            Subtotal:
            ${money(subtotal)}

          </div>

        </div>

      `;

    }).join('');


  /* =========================
     PAGOS
     ========================= */

  const paymentsContainer =
    document.getElementById('payments');


  paymentsContainer.innerHTML =
    pays.map((p,i) => `

      <div class="payment">

        <div class="row">

          <select
            onchange="
              pays[${i}].method =
                this.value
            "
          >

            <option
              value="Efectivo"
              ${p.method === 'Efectivo'
                ? 'selected'
                : ''}
            >
              Efectivo
            </option>


            <option
              value="Zelle"
              ${p.method === 'Zelle'
                ? 'selected'
                : ''}
            >
              Zelle
            </option>


            <option
              value="Cash App"
              ${p.method === 'Cash App'
                ? 'selected'
                : ''}
            >
              Cash App
            </option>


            <option
              value="Tarjeta"
              ${p.method === 'Tarjeta'
                ? 'selected'
                : ''}
            >
              Tarjeta
            </option>


            <option
              value="Otro"
              ${p.method === 'Otro'
                ? 'selected'
                : ''}
            >
              Otro
            </option>

          </select>


          <input
            type="number"
            step=".01"
            min="0"
            placeholder="Monto"
            value="${p.amount}"
            onchange="
              pays[${i}].amount =
                Math.max(
                  0,
                  Number(this.value) || 0
                );

              render();
            "
          >

        </div>


        <div class="payment-actions">

          <button
            class="danger"
            type="button"
            onclick="
              deletePayment(${i})
            "
          >

            🗑️ Eliminar pago

          </button>

        </div>

      </div>

    `).join('');


  /* =========================
     TOTALES
     ========================= */

  const totalAmount =
    cart.reduce(

      (sum,item) => {

        return sum +
          (
            Number(item.qty || 0) *
            Number(item.unit_price || 0)
          );

      },

      0

    );


  const paidAmount =
    pays.reduce(

      (sum,payment) => {

        return sum +
          Number(
            payment.amount || 0
          );

      },

      0

    );


  const balanceAmount =
    Math.max(
      0,
      totalAmount - paidAmount
    );


  /* =========================
     RESUMEN GENERAL
     ========================= */

  const validItems =
    cart.filter(
      item => item.product
    );


  const summary =
    validItems.length

      ? validItems.map(
          item => {

            const itemSubtotal =
              Number(item.qty || 0) *
              Number(item.unit_price || 0);


            return `

              <div>

                ${item.product}
                × ${item.qty}
                = ${money(itemSubtotal)}

                ${
                  item.promotion_description
                    ? `
                      <small>
                        🎁 ${item.promotion_description}
                      </small>
                    `
                    : ''
                }

              </div>

            `;

          }
        ).join('')

      : 'Sin productos';


  document.getElementById(
    'productSummary'
  ).innerHTML =
    summary;


  document.getElementById(
    'productsSubtotal'
  ).textContent =
    money(totalAmount);


  document.getElementById('total')
    .textContent =
      money(totalAmount);


  document.getElementById('paid')
    .textContent =
      money(paidAmount);


  document.getElementById('balance')
    .textContent =
      money(balanceAmount);


  /* =========================
     ESTADO DEL PAGO
     ========================= */

  let paymentStatus =
    'No pagado';


  if(totalAmount <= 0){

    paymentStatus =
      'No pagado';

  }else if(paidAmount <= 0){

    paymentStatus =
      'No pagado';

  }else if(paidAmount < totalAmount){

    paymentStatus =
      'Pago parcial';

  }else{

    paymentStatus =
      'Pagado';

  }


  document.getElementById(
    'paymentStatus'
  ).textContent =
    paymentStatus;

}

/* =========================
   GUARDAR / ACTUALIZAR
   ========================= */

async function save(){

  const client =
    document.getElementById('client')
      .value.trim();


  const date =
    document.getElementById('date')
      .value;


  const status =
    document.getElementById('status')
      .value;


  const notes =
    document.getElementById('notes')
      .value;


  if(!client || !date){

    return alert(
      'Agrega cliente y fecha.'
    );

  }


  /*
     Si el pedido NO está cancelado,
     debe tener productos válidos.
  */

  if(status !== 'Cancelado'){

    if(!cart.length){

      return alert(
        'Agrega al menos un producto.'
      );

    }


    const invalidProduct =
      cart.some(
        item => !item.product
      );


    if(invalidProduct){

      return alert(
        'Selecciona un producto en cada línea antes de guardar.'
      );

    }

  }


  /*
     Si está cancelado,
     todo queda en cero.
  */

  let itemsToSave = cart;

  let paymentsToSave = pays;


  if(status === 'Cancelado'){

    itemsToSave = [];

    paymentsToSave = [];

  }


  const payload = {

    client:client,

    delivery_date:date,

    status:status,

    notes:notes,

    items:itemsToSave,

    payments:paymentsToSave

  };


  let url = '/orders';

  let method = 'POST';


  if(editingOrderId !== null){

    url =
      '/orders/' +
      editingOrderId;

    method = 'POST';

  }


  const response =
    await fetch(

      url,

      {

        method:method,

        headers:{
          'Content-Type':
            'application/json'
        },

        body:
          JSON.stringify(payload)

      }

    );


  if(response.ok){

    alert(
      editingOrderId !== null
        ? 'Pedido actualizado correctamente.'
        : 'Pedido guardado correctamente.'
    );

    location.reload();

  }else{

    alert(
      'No se pudo guardar el pedido.'
    );

  }

}


/* =========================
   EDITAR PEDIDO
   ========================= */

function editOrder(order){

  editingOrderId =
    order.id;


  document.getElementById(
    'formTitle'
  ).textContent =
    'Editar pedido #' +
    order.id;


  document.getElementById(
    'client'
  ).value =
    order.client;


  document.getElementById(
    'date'
  ).value =
    order.delivery_date;


  document.getElementById(
    'status'
  ).value =
    order.status;


  document.getElementById(
    'notes'
  ).value =
    order.notes || '';


  cart =
    (order.items || []).map(
      item => ({

        product:item.product,

        qty:Number(item.qty),

        unit_price:
          Number(item.unit_price),

        promotion_id:
          item.promotion_id || '',

        promotion_name:
          item.promotion_name || '',

        promotion_description:
          item.promotion_description || ''

      })
    );


  if(order.status === 'Cancelado'){

    cart = [];

  }


  pays =
    (order.payments || []).map(
      payment => ({

        method:payment.method,

        amount:
          Number(payment.amount)

      })
    );


  if(order.status === 'Cancelado'){

    pays = [];

  }


  if(
    order.status !== 'Cancelado' &&
    cart.length === 0
  ){

    cart.push(
      emptyProduct()
    );

  }


  document.getElementById(
    'saveButton'
  ).textContent =
    'Actualizar pedido';


  document.getElementById(
    'cancelEditButton'
  ).style.display =
    'inline-block';


  render();


  window.scrollTo({

    top:0,

    behavior:'smooth'

  });

}


/* =========================
   CANCELAR EDICIÓN
   ========================= */

function cancelEdit(){

  editingOrderId = null;

  cart = [
    emptyProduct()
  ];

  pays = [];


  document.getElementById(
    'formTitle'
  ).textContent =
    'Nuevo pedido';


  document.getElementById(
    'client'
  ).value =
    '';


  document.getElementById(
    'date'
  ).value =
    '';


  document.getElementById(
    'status'
  ).value =
    'Pendiente de elaborar';


  document.getElementById(
    'notes'
  ).value =
    '';


  document.getElementById(
    'saveButton'
  ).textContent =
    'Guardar pedido';


  document.getElementById(
    'cancelEditButton'
  ).style.display =
    'none';


  render();

}


/* =========================
   ELIMINAR PEDIDO
   ========================= */

async function removeOrder(id){

  if(
    !confirm(
      '¿Eliminar este pedido definitivamente?'
    )
  ){

    return;

  }


  const response =
    await fetch(

      '/orders/' + id,

      {
        method:'DELETE'
      }

    );


  if(response.ok){

    location.reload();

  }else{

    alert(
      'No se pudo eliminar el pedido.'
    );

  }

}


/* =========================
   INICIO
   ========================= */

cart = [
  emptyProduct()
];

pays = [];

render();


/* =========================
   PEDIDOS GUARDADOS
   ========================= */

const ordersData = [

{% for o in orders %}

{

  id:{{o.id}},

  client:
    {{o.client|tojson}},

  delivery_date:
    {{o.delivery_date|tojson}},

  status:
    {{o.status|tojson}},

  notes:
    {{o.notes|tojson}},

  total:
    {{o.total}},

  paid:
    {{o.paid}},

  balance:
    {{o.balance}},

  items:
    {{o.items|tojson}},

  payments:
    {{o.payments|tojson}}

}

{% if not loop.last %},{% endif %}

{% endfor %}

];


document.getElementById(
  'orders'
).innerHTML = ordersData.map(
  order => {

    const total =
      Number(order.total || 0);


    const paid =
      Number(order.paid || 0);


    const balance =
      Number(order.balance || 0);


    let paymentStatus =
      'No pagado';


    if(total > 0 && paid >= total){

      paymentStatus =
        'Pagado';

    }else if(paid > 0){

      paymentStatus =
        'Pago parcial';

    }


    const itemsHtml =
      (order.items || []).map(
        item => `

          <div>

            ${item.qty}
            ×
            ${item.product}
            —
            ${money(
              Number(item.qty) *
              Number(item.unit_price)
            )}

            ${
              item.promotion_description
                ? `
                  <br>
                  <small>
                    🎁 ${item.promotion_description}
                  </small>
                `
                : ''
            }

          </div>

        `
      ).join('');


    const paymentsHtml =
      (order.payments || []).map(
        payment => `

          <div>

            ${payment.method}:
            ${money(payment.amount)}

          </div>

        `
      ).join('');


    return `

      <div class="card">

        <h3>

          Pedido #${order.id}

        </h3>


        <b>

          ${order.client}

        </b>


        <br><br>


        ${itemsHtml || 'Sin productos'}


        <br>


        <span class="tag">

          📅
          ${order.delivery_date}

        </span>


        <span class="tag">

          📌
          ${order.status}

        </span>


        <span class="tag">

          💰
          Total ${money(total)}

        </span>


        <span class="tag">

          💵
          Pagado ${money(paid)}

        </span>


        <span class="tag">

          Saldo ${money(balance)}

        </span>


        <div class="payment-status">

          Estado de pago:
          ${paymentStatus}

        </div>


        ${
          paymentsHtml
            ? `
              <br><br>
              <b>Pagos:</b>
              ${paymentsHtml}
            `
            : ''
        }


        ${
          order.notes
            ? `
              <br><br>
              📝 ${order.notes}
            `
            : ''
        }


        <div class="order-buttons">

          <button
            class="secondary"
            onclick='editOrder(
              ${JSON.stringify(order)}
            )'
          >

            ✏️ Editar

          </button>


          <button
            class="danger"
            onclick="
              removeOrder(
                ${order.id}
              )
            "
          >

            🗑️ Eliminar

          </button>

        </div>

      </div>

    `;

  }
).join('');


</script>


</body>
